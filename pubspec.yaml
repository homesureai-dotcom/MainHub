
name: homesure_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  flutter_svg: ^2.2.1

  # Dashboard V3
  percent_indicator: ^4.2.3

  # Premium animations
  flutter_animate: ^4.5.2

  # Lottie animations
  lottie: ^3.3.2

  # Smooth page indicators
  smooth_page_indicator: ^1.2.1

  # Evidence capture
  file_picker: ^13.1.0
  image_picker: ^1.2.1

  # PDF generation and printing
  pdf: ^3.11.3
  printing: ^5.14.2

  # Firebase
  firebase_core: ^5.0.0
  firebase_analytics: ^13.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/NotoSansKannada-Regular.ttf
    - assets/fonts/NotoSansDevanagari-Regular.ttf
    - assets/fonts/NotoSansTelugu-Regular.ttf
    - assets/fonts/NotoSansTamil-Regular.ttf
    - assets/fonts/NotoSansMalayalam-Regular.ttf
